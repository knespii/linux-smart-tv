# Smart TV – připojení k Home Assistantu (panel „Home Assistant“ na hlavní obrazovce).

# Adresa Home Assistantu, jak ji otevíráš v prohlížeči:
url = http://homeassistant.local:8123

# Dlouhodobý přístupový token: v Home Assistantu klikni vlevo dole na svůj profil,
# záložka Zabezpečení, dole „Dlouhodobé přístupové tokeny“ → Vytvořit token.
# Vlož ho sem za rovnítko:
token =

# Certifikát podepsaný sám sebou (https bez platného certifikátu):
# verify_ssl = no

# První řádek „Oblíbené“ (ID entit oddělená čárkou):
# favorites = light.obyvak, scene.kino

# Tyhle entity se v panelu nezobrazí:
# hide = switch.neco
